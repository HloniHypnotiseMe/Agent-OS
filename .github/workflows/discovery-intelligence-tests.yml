name: Discovery Intelligence Tests

on:
  pull_request:
    paths:
      - "discovery_intelligence/**"
      - "tests/test_discovery_intelligence.py"
      - ".github/workflows/discovery-intelligence-tests.yml"
  push:
    branches:
      - "feature/discovery-intelligence-v1"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test runner
        run: python -m pip install --upgrade pip pytest
      - name: Run Discovery Intelligence tests
        run: python -m pytest tests/test_discovery_intelligence.py -q
