name: Commercial Cost Ledger Tests

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]

jobs:
  cost-ledger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Run commercial cost ledger tests
        run: python -m pytest tests/test_cost_ledger.py tests/test_usage_hooks.py tests/test_commercial_delivery_instrumentation.py -q
